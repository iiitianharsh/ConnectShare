<!DOCTYPE html>
<html>
<head>
    <title>Production WebSocket Test</title>
</head>
<body>
    <h1>Production WebSocket Connection Test</h1>
    <button onclick="testWebSocket()">Test Production WebSocket</button>
    <div id="output"></div>

    <script>
        function testWebSocket() {
            const output = document.getElementById('output');
            output.innerHTML = 'Testing production WebSocket connection...';
            
            try {
                console.log('Attempting WebSocket connection to: wss://connectshare-signaling.2003harshjais.workers.dev?name=production-test');
                const ws = new WebSocket('wss://connectshare-signaling.2003harshjais.workers.dev?name=production-test');
                
                ws.onopen = () => {
                    console.log('✅ Production WebSocket connected successfully');
                    output.innerHTML += '<br>✅ Production WebSocket connected successfully';
                    ws.close();
                };
                
                ws.onerror = (error) => {
                    console.error('❌ Production WebSocket error:', error);
                    output.innerHTML += '<br>❌ Production WebSocket error: ' + error;
                };
                
                ws.onclose = () => {
                    console.log('🔌 Production WebSocket connection closed');
                    output.innerHTML += '<br>🔌 Production WebSocket connection closed';
                };
                
                ws.onmessage = (event) => {
                    console.log('📨 Received message:', event.data);
                    output.innerHTML += '<br>📨 Received: ' + event.data;
                };
                
                // Timeout after 5 seconds
                setTimeout(() => {
                    if (ws.readyState === WebSocket.CONNECTING) {
                        console.error('⏰ Production WebSocket connection timeout');
                        output.innerHTML += '<br>⏰ Production WebSocket connection timeout';
                        ws.close();
                    }
                }, 5000);
                
            } catch (error) {
                console.error('❌ Error creating WebSocket:', error);
                output.innerHTML += '<br>❌ Error creating WebSocket: ' + error.message;
            }
        }
    </script>
</body>
</html>
